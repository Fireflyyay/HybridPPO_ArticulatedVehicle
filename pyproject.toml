[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridppo-articulated-vehicle"
version = "0.1.0"
description = "SMDP Hybrid PPO with parameterized motion primitives for center-articulated vehicles"
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "shapely>=1.8",
    "matplotlib>=3.5",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
